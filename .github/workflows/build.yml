name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "HouseKeeper/**"
      - "HouseKeeper.xcodeproj/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "HouseKeeper/**"
      - "HouseKeeper.xcodeproj/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: unsigned-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: HouseKeeper.xcodeproj
  SCHEME: HouseKeeper
  CONFIGURATION: Release
  DERIVED_DATA_PATH: ${{ github.workspace }}/DerivedData

jobs:
  build:
    name: Build unsigned IPA
    # macos-14 比 macos-15 更稳定：macos-15 (arm64) 在容量受限时频繁出现 Xcode build system crash
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Verify App Icon
        shell: bash
        run: |
          set -euo pipefail
          test -s HouseKeeper/Assets.xcassets/AppIcon.appiconset/AppIcon.png
      - name: Verify project and scheme
        shell: bash
        run: |
          set -euo pipefail
          test -d "$PROJECT_PATH"
          xcodebuild -project "$PROJECT_PATH" -list
          xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -showBuildSettings -configuration "$CONFIGURATION" >/dev/null
      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(xcodebuild -project "$PROJECT_PATH" -scheme "$SCHEME" -configuration "$CONFIGURATION" -showBuildSettings)"
          VERSION="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / {print $2; exit}')"
          BUILD="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*CURRENT_PROJECT_VERSION = / {print $2; exit}')"
          PRODUCT_NAME="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*WRAPPER_NAME = / {print $2; exit}')"
          if [[ -z "$PRODUCT_NAME" ]]; then
            PRODUCT_NAME="$(printf '%s\n' "$SETTINGS" | awk -F ' = ' '/^[[:space:]]*FULL_PRODUCT_NAME = / {print $2; exit}')"
          fi
          test -n "$VERSION"
          test -n "$BUILD"
          test -n "$PRODUCT_NAME"
          IPA_NAME="房源管家${VERSION}.ipa"
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "product_name=$PRODUCT_NAME"
            echo "ipa_name=$IPA_NAME"
          } >> "$GITHUB_OUTPUT"
      - name: Build for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DERIVED_DATA_PATH"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
      - name: Ad-hoc sign App
        shell: bash
        env:
          PRODUCT_NAME: ${{ steps.metadata.outputs.product_name }}
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos/$PRODUCT_NAME"
          test -d "$APP_PATH"
          /usr/bin/codesign --force --sign - --deep "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict "$APP_PATH"
      - name: Package unsigned IPA
        id: package
        shell: bash
        env:
          PRODUCT_NAME: ${{ steps.metadata.outputs.product_name }}
          IPA_NAME: ${{ steps.metadata.outputs.ipa_name }}
        run: |
          set -euo pipefail
          APP_PATH="$DERIVED_DATA_PATH/Build/Products/${CONFIGURATION}-iphoneos/$PRODUCT_NAME"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          ditto "$APP_PATH" "artifacts/Payload/$PRODUCT_NAME"
          (cd artifacts && /usr/bin/zip -qry "$IPA_NAME" Payload)
          test -s "artifacts/$IPA_NAME"
          echo "ipa_path=artifacts/$IPA_NAME" >> "$GITHUB_OUTPUT"
      - name: Publish IPA to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: ${{ steps.package.outputs.ipa_path }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "房源管家 ${VERSION} (build ${BUILD})" \
            --notes "免签名 IPA（ad-hoc），巨魔商店 / 爱思助手可安装" \
            --prerelease
